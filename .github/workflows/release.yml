# Release: pack + publish to NuGet.org on a version tag (design sections 8, 9).
#
# Two independent release cadences share this workflow, selected by tag prefix:
#   - Library packages (Line.OpenApi.Core/.../Bot): push a tag like `v0.1.0-preview`.
#     The CLI/MCP tool package is excluded here (-p:ExcludeToolFromPack=true).
#   - CLI/MCP tool (Line.OpenApi.Tools): push a tag like `tools-v0.1.0-preview`.
#   - AI tools (Line.OpenApi.Extensions.AI): push a tag like `ai-v0.1.0-preview`.
#
# The resolved version is applied at BUILD time (not just pack) so the assembly's
# AssemblyVersion/FileVersion and the .nupkg version stay in sync.
#
# Publishing uses NuGet.org Trusted Publishing (OIDC) - no long-lived API key secret.
# Each publish job requests a GitHub OIDC token (permissions: id-token: write), exchanges
# it via NuGet/login for a short-lived (1h) API key, then pushes. Requires a Trusted
# Publishing policy on nuget.org matching this repo/workflow/environment:
#   Repository Owner: pierre3 | Repository: line-openapi-dotnet
#   Workflow File: release.yml | Environment: nuget
name: release

on:
  push:
    tags: ['v*', 'tools-v*', 'ai-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Library package version (e.g. 0.1.0-preview). Defaults to Directory.Build.props.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # --- Library packages: tag `v*` (or manual dispatch) -------------------------
  publish-libraries:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # Bind to a protected environment so nuget.org publishing can require reviewers /
    # branch or tag protection rules (configure under Settings > Environments > nuget).
    environment: nuget
    permissions:
      contents: read
      id-token: write # request a GitHub OIDC token for NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Derive the package version: tag (strip leading "v") on tag push, else the
      # workflow_dispatch input, else empty (falls back to Directory.Build.props).
      # The input is read via env to avoid inline expansion into the shell.
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${INPUT_VERSION}" ]; then
            echo "value=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore LineOpenApi.slnx

      # Apply the version at build time too, so the assembly stamps match the package.
      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          VERSION_ARG=""
          if [ -n "${VERSION}" ]; then VERSION_ARG="-p:Version=${VERSION}"; fi
          dotnet build LineOpenApi.slnx --configuration Release --no-restore $VERSION_ARG

      - name: Test
        run: dotnet test LineOpenApi.slnx --configuration Release --no-build --verbosity normal

      # Exclude the CLI/MCP tool from the library release (separate cadence, tag tools-v*).
      - name: Pack
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          VERSION_ARG=""
          if [ -n "${VERSION}" ]; then VERSION_ARG="-p:Version=${VERSION}"; fi
          dotnet pack LineOpenApi.slnx --configuration Release --no-build -o artifacts -p:ExcludeToolFromPack=true $VERSION_ARG

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key (valid 1h).
      # Runs immediately before push so the key does not expire.
      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: pierre3

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # --- AI tools package: tag `ai-v*` -------------------------------------------
  publish-ai:
    if: ${{ startsWith(github.ref, 'refs/tags/ai-v') }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # request a GitHub OIDC token for NuGet Trusted Publishing
    env:
      AI_PROJECT: tools/Line.OpenApi.Extensions.AI/Line.OpenApi.Extensions.AI.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # ai-v0.1.0-preview -> 0.1.0-preview
      - name: Resolve version
        id: ver
        run: echo "value=${GITHUB_REF_NAME#ai-v}" >> "$GITHUB_OUTPUT"

      # Build the test project (which references the AI project) with the resolved version, so the
      # AI assembly's AssemblyVersion/FileVersion match the package version. Then test and pack
      # --no-build to package exactly that stamped assembly (mirrors the library job).
      - name: Restore
        run: dotnet restore tests/Line.OpenApi.Extensions.AI.Tests/Line.OpenApi.Extensions.AI.Tests.csproj

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: dotnet build tests/Line.OpenApi.Extensions.AI.Tests/Line.OpenApi.Extensions.AI.Tests.csproj --configuration Release --no-restore -p:Version="${VERSION}"

      - name: Test
        run: dotnet test tests/Line.OpenApi.Extensions.AI.Tests/Line.OpenApi.Extensions.AI.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: dotnet pack "$AI_PROJECT" --configuration Release --no-build -o artifacts -p:Version="${VERSION}"

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key (valid 1h).
      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: pierre3

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # --- CLI/MCP tool package: tag `tools-v*` ------------------------------------
  publish-tool:
    if: ${{ startsWith(github.ref, 'refs/tags/tools-v') }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # request a GitHub OIDC token for NuGet Trusted Publishing
    env:
      TOOL_PROJECT: tools/Line.OpenApi.Tools/Line.OpenApi.Tools.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # tools-v0.1.0-preview -> 0.1.0-preview
      - name: Resolve version
        id: ver
        run: echo "value=${GITHUB_REF_NAME#tools-v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "$TOOL_PROJECT"

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: dotnet build "$TOOL_PROJECT" --configuration Release --no-restore -p:Version="${VERSION}"

      - name: Test
        run: dotnet test tests/Line.OpenApi.Tools.Tests/Line.OpenApi.Tools.Tests.csproj --configuration Release --verbosity normal

      - name: Pack
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: dotnet pack "$TOOL_PROJECT" --configuration Release --no-build -o artifacts -p:Version="${VERSION}"

      # Exchange the GitHub OIDC token for a short-lived nuget.org API key (valid 1h).
      - name: NuGet login (OIDC -> temp API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: pierre3

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
